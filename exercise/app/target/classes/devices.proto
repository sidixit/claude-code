syntax = "proto3";

package com.coderpad.app.model;

option java_package = "com.coderpad.app.model";
option java_multiple_files = true;
option java_outer_classname = "DeviceEventProto";

message DeviceEvent {
  string device_id        = 1;
  int64  user_id          = 2;
  string event_type       = 3;
  double lat              = 4;
  double lon              = 5;
  double accuracy_meters  = 6;
  double altitude_meters  = 7;
  double speed_mps        = 8;
  double heading_degrees  = 9;
  repeated string tags    = 10;
  map<string, string> metadata = 11;
  bool   is_foreground    = 12;
  int32  battery_pct      = 13;
  int64  timestamp_ms     = 14;
  string session_id       = 15;
}
